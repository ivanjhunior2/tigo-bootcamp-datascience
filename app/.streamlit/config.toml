# Tema Streamlit -- misma paleta colorblind-safe validada que usan los
# notebooks de analisis (ver notebooks/analysis/01_insights.ipynb, setup)
# y docs/decisiones.md. Consistencia visual entre notebooks, Streamlit y
# Superset, no un tema inventado aparte.
[theme]
base = "dark"
primaryColor = "#2a78d6"
backgroundColor = "#000000"
secondaryBackgroundColor = "#111111"
textColor = "#fcfcfb"
font = "sans serif"
