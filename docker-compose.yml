x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    WAREHOUSE_HOST: postgres
    WAREHOUSE_PORT: 5432
    WAREHOUSE_DB: ${POSTGRES_DB}
    WAREHOUSE_USER: ${POSTGRES_USER}
    WAREHOUSE_PASSWORD: ${POSTGRES_PASSWORD}
    DATA_ROOT: /opt/airflow/data
    PARQUET_ROOT: /opt/airflow/data/parquet
    NOTEBOOKS_ROOT: /opt/airflow/notebooks
  volumes:
    - ./dags:/opt/airflow/dags
    - ./sql:/opt/airflow/sql
    - ./sql:/home/jovyan/work/sql  # los notebooks de gold hardcodean esta ruta
    - ./src:/opt/airflow/src
    - ./src:/home/jovyan/work/src  # los notebooks hardcodean esta ruta (ver notebooks/README.md)
    - ./notebooks:/opt/airflow/notebooks
    - ./university:/opt/airflow/data/university:ro
    - ./billing:/opt/airflow/data/billing:ro
    - ./crm:/opt/airflow/data/crm:ro
    - ./manifest.json:/opt/airflow/data/manifest.json:ro
    - ./data/parquet:/opt/airflow/data/parquet
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile
    env_file: .env
    environment:
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: 5432
      WAREHOUSE_DB: ${POSTGRES_DB}
      WAREHOUSE_USER: ${POSTGRES_USER}
      WAREHOUSE_PASSWORD: ${POSTGRES_PASSWORD}
      DATA_ROOT: /home/jovyan/work/data
      PARQUET_ROOT: /home/jovyan/work/data/parquet
      MODELS_ROOT: /home/jovyan/work/models
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./sql:/home/jovyan/work/sql
      - ./src:/home/jovyan/work/src
      - ./models:/home/jovyan/work/models
      - ./university:/home/jovyan/work/data/university:ro
      - ./billing:/home/jovyan/work/data/billing:ro
      - ./crm:/home/jovyan/work/data/crm:ro
      - ./manifest.json:/home/jovyan/work/data/manifest.json:ro
      - ./data/parquet:/home/jovyan/work/data/parquet
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    volumes:
      - ./app:/app
      - ./models:/app/models:ro
    ports:
      - "8501:8501"

  spark-exercise:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    profiles:
      - tools
    environment:
      PARQUET_ROOT: /app/data/parquet
    volumes:
      - ./src:/app/src
      - ./data/parquet:/app/data/parquet:ro

volumes:
  pgdata:
  airflow_logs:
